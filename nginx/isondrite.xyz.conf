server {
    listen 443 ssl;
    resolver 127.0.0.11 valid=1s ipv6=off;
    server_name isondrite.xyz;

    ssl_certificate /etc/nginx/certs/isondrite.xyz.cert.pem;
    ssl_certificate_key /etc/nginx/certs/isondrite.xyz.key.pem;

    location / {
        set $upstream "http://isondrite:8000";

        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}